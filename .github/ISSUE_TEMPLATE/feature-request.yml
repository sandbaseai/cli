name: Feature request
description: Propose a focused improvement or new client integration
title: "feature: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Strong proposals start with the workflow that is currently difficult, then explain the smallest useful improvement.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for similar requests.
          required: true
        - label: I can describe a concrete user workflow this would improve.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to accomplish, and where does the current workflow break down?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the smallest behavior that would solve the problem.
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Affected AI client or integration
      placeholder: "Claude Code, Cursor, Codex, or not client-specific"
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any current workaround or related tool.
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Link first-party client documentation or specifications when proposing a new integration.
