name: Release to npm

# Keep this name: publish-mcp-registry.yml runs after "Release to npm" completes.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      contents: read
      # publishConfig.provenance=true signs the tarball with the GitHub OIDC identity.
      # Authentication to the registry is the NPM_TOKEN secret, not OIDC.
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Writes $RUNNER_TEMP/.npmrc containing only the ${NODE_AUTH_TOKEN} placeholder.
      # The token itself is passed as an env var to the publish step and never written to disk.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify tag matches package.json
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          if ! [[ "$tag_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not v<semver> (for example v1.2.3)"
            exit 1
          fi
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          if [ "$package_name" != "@sandbaseai/cli" ]; then
            echo "::error::package.json name is $package_name, expected @sandbaseai/cli"
            exit 1
          fi
          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $package_version"
            exit 1
          fi
          if [ "$lock_version" != "$package_version" ]; then
            echo "::error::package-lock.json version $lock_version does not match package.json version $package_version"
            exit 1
          fi
          if [ "$(node -p "require('./package.json').publishConfig?.access")" != "public" ]; then
            echo "::error::publishConfig.access must be public for the scoped package"
            exit 1
          fi
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "::error::$package_name@$package_version is already published and cannot be overwritten"
            exit 1
          fi
          # This file is excluded because it contains the pattern itself.
          if git grep -l -I -E '_authToken|npm_[A-Za-z0-9]{36}' -- ':!.github/workflows/release.yml'; then
            echo "::error::The tracked files above contain an npm auth token or _authToken entry"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Audit package contents
        run: npm run audit:package

      - name: Publish to npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is not configured"
            exit 1
          fi
          npm publish --ignore-scripts --access public --tag latest
