name: Publish to MCP Registry

on:
  workflow_run:
    workflows: [Release to npm]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Published npm version to register (without v)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mcp-registry-${{ github.event.workflow_run.head_branch || inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve and validate version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [ -z "$version" ]; then
            version="$MANUAL_VERSION"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $version" >&2
            exit 1
          fi
          npm_version=""
          for attempt in {1..30}; do
            npm_version="$(npm view "@sandbaseai/cli@$version" version 2>/dev/null || true)"
            if [ "$npm_version" = "$version" ]; then
              break
            fi
            echo "Waiting for @sandbaseai/cli@$version to become available (attempt $attempt/30)"
            sleep 10
          done
          if [ "$npm_version" != "$version" ]; then
            echo "@sandbaseai/cli@$version is not available on npm" >&2
            exit 1
          fi
          npm_mcp_name="$(npm view "@sandbaseai/cli@$version" mcpName)"
          if [ "$npm_mcp_name" != "io.github.sandbaseai/cli" ]; then
            echo "Published package does not contain the expected mcpName" >&2
            exit 1
          fi
          jq --arg version "$version" \
            '.version = $version | .packages |= map(.version = $version)' \
            server.json > server.tmp.json
          mv server.tmp.json server.json
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher

      - name: Validate registry metadata
        run: ./mcp-publisher validate

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server metadata
        run: ./mcp-publisher publish

      - name: Verify registry listing
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          response="$(curl -fsSL 'https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.sandbaseai%2Fcli')"
          jq -e --arg version "$VERSION" \
            '.servers | any(.server.name == "io.github.sandbaseai/cli" and .server.version == $version)' \
            <<< "$response"
